<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M9 8h4v9a3 3 0 006 0V8h4v9a7 7 0 01-14 0z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Clinical Lab Triage Agent</title>
    <script>
      // Apply the theme before first paint, otherwise a dark-mode user sees a
      // flash of the light palette while React mounts.
      (function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {
          /* storage blocked — fall back to the OS preference */
        }
        if (t !== 'dark' && t !== 'light') {
          t =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
