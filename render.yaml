# Render blueprint — ONE service that serves both the API and the frontend.
#
# Deploy: Render -> New -> Blueprint -> pick this repo -> Apply.
# The only manual step is pasting GEMINI_API_KEY; nothing else needs setting.
#
# A split frontend/backend deploy needs VITE_API_BASE baked in at build time and
# CORS configured to match. Both are easy to miss, and missing either leaves the
# deployed page calling 127.0.0.1. Serving the built frontend from the API
# process makes them same-origin and removes both settings.
#
# Docker rather than a native runtime because the build needs Node (frontend)
# and Python (API), and because the agent spawns the MCP server as a stdio
# subprocess per request.

services:
  - type: web
    name: lab-triage
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false                    # set in the dashboard; never committed
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite   # avoid non-lite flash: 20 req/day free cap
